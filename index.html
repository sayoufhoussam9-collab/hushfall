:root{

.sheet-in{max-width:760px;margin:0 auto;padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opts .chip{justify-content:center;padding:0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}

.dim{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:#5b5873}

function tone(out,t,{f,type='sine',g,att=0.005,dur,p=0,glide}){
  const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide,t+dur);
  const e=ctx.createGain(); e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+att);
  e.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  chain(o,e,pan(p),out); o.start(t); o.stop(t+dur+0.05);
}

  if (ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({latencyHint:'playback'});
  try { if (navigator.audioSession) navigator.audioSession.type='playback'; } catch(e){}
  master=gain(S.master*S.master); timerGain=gain(1);
  comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=.01; comp.release.value=.3;
  chain(master,timerGain,comp);
  /* Send the sound through a media element so phones treat it like music:
     it keeps playing with the screen off and shows lock-screen controls. */
  try {
    const dest=ctx.createMediaStreamDestination(); comp.connect(dest);
    outEl=document.createElement('audio'); outEl.setAttribute('playsinline',''); outEl.srcObject=dest.stream;
  } catch(e){ outEl=null; comp.connect(ctx.destination); }
  NB.white=makeNoise('white',10); NB.pink=makeNoise('pink',10); NB.brown=makeNoise('brown',10);
  setInterval(schedule, 200);
}
const level = id => { const v=S.mix[id]??.6; return BY[id].lvl * v*v * 2.2; };

function startSound(id){
  if (live[id]) return;
  const out=gain(0), t=ctx.currentTime; out.connect(master);
  out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(level(id), t+1.8);
  const r=BY[id].build(out);
  live[id]={out, srcs:r.srcs, tick:r.tick, next:t+(BY[id].first ?? .05)};
}
function stopSound(id){
  const L=live[id]; if (!L) return; delete live[id];
  const t=ctx.currentTime; L.out.gain.cancelScheduledValues(t); L.out.gain.setValueAtTime(L.out.gain.value,t); L.out.gain.linearRampToValueAtTime(0,t+.9);
  setTimeout(()=>{ L.srcs.forEach(s=>{ try{s.stop();}catch(e){} }); try{L.out.disconnect();}catch(e){} }, 1400);
}
function schedule(){
  if (!ctx || ctx.state!=='running') return;
  const horizon=ctx.currentTime+3;
  for (const id in live){ const L=live[id]; if (!L.tick) continue;
    if (L.next < ctx.currentTime) L.next = ctx.currentTime+.02;
    let guard=0; while (L.next<horizon && guard++<400){ L.next += L.tick(L.next); } }
  if (timer && Date.now()>=timer.end) endTimer();
}
function sync(){
  for (const id in live) if (!(id in S.mix) || !playing) stopSound(id);
  if (playing) for (const id in S.mix) startSound(id);
}
async function play(){
  if (!Object.keys(S.mix).length) S.mix={rain:.6};
  ensureCtx(); playing=true;
  try { await ctx.resume(); } catch(e){}
  if (outEl){ try { await outEl.play(); } catch(e){ try{comp.disconnect();}catch(_){} comp.connect(ctx.destination); outEl=null; } }
  sync(); render(); media();
}
function pause(){
  playing=false; sync(); clearTimer(true); render(); media();
  setTimeout(()=>{ if (!playing && ctx){ ctx.suspend(); outEl?.pause(); } }, 1500);
}

/* ---------- timer ---------- */
function setTimer(min){
  if (!min){ clearTimer(); toast(t('timerOff')); render(); return; }
  if (!playing) play();
  ensureCtx(); const now=ctx.currentTime, dur=min*60, fade=Math.min(S.fade, dur*.5);
  const g=timerGain.gain; g.cancelScheduledValues(now); g.setValueAtTime(g.value,now); g.linearRampToValueAtTime(1,now+.5);
  g.setValueAtTime(1, now+dur-fade); g.linearRampToValueAtTime(0.0001, now+dur);
  timer={end:Date.now()+dur*1000, total:dur};
  toast(t('stops', durLabel(min), secLabel(fade)));
  render();
}
function clearTimer(quiet){
  if (!timer) return; timer=null;
  if (ctx){ const g=timerGain.gain, n=ctx.currentTime; g.cancelScheduledValues(n); g.setValueAtTime(g.value,n); g.linearRampToValueAtTime(1,n+1); }
  if (quiet===true) render();
}
function endTimer(){ timer=null; playing=false; sync(); render(); media();
  setTimeout(()=>{ if (!playing && ctx){ ctx.suspend(); outEl?.pause(); const g=timerGain.gain; g.cancelScheduledValues(0); g.value=1; } }, 1500); }
const fmt = s => { s=Math.max(0,Math.ceil(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function buildGrid(){
  const groups=[...new Set(SOUNDS.map(s=>s.g))];
  $('groups').innerHTML = groups.map(g=>`<h2>${gname(g)}</h2><div class="grid">${SOUNDS.filter(s=>s.g===g).map(s=>`
    <div class="tile" data-id="${s.id}">
      <button class="tbtn" aria-pressed="false" aria-label="${nm(s)}"><span class="ico"><svg viewBox="0 0 24 24">${I[s.icon]}</svg></span>
      <span class="tname">${nm(s)}<span class="tnote">${nt(s)}</span></span></button>
      <input type="range" min="0" max="100" value="60" id="v-${s.id}" aria-label="${t('vol',nm(s))}">
    </div>`).join('')}</div>`).join('');
  for (const id in S.mix) if ($('v-'+id)) $('v-'+id).value=Math.round(S.mix[id]*100);
  if (buildGrid.done) return; buildGrid.done=true;
  $('groups').addEventListener('click', e=>{
    const b=e.target.closest('.tbtn'); if (!b) return;
    const id=b.parentElement.dataset.id;
    if (id in S.mix){ delete S.mix[id]; } else { S.mix[id]=(+$('v-'+id).value)/100 || .6; }
    S.mixName=''; save();
    if (!Object.keys(S.mix).length){ pause(); return; }
    if (!playing) play(); else { sync(); render(); media(); }
  });
  $('groups').addEventListener('input', e=>{
    const r=e.target; if (r.type!=='range') return;
    const id=r.closest('.tile').dataset.id, v=r.value/100;
    r.style.setProperty('--p', r.value+'%');
    if (!(id in S.mix)){ S.mix[id]=v; S.mixName=''; save(); if (!playing) play(); else { sync(); render(); } return; }
    S.mix[id]=v; save();
    if (live[id]) live[id].out.gain.setTargetAtTime(level(id), ctx.currentTime, .08);
  });
}
function mixEq(a,b){ const ka=Object.keys(a), kb=Object.keys(b); return ka.length===kb.length && ka.every(k=>k in b); }
function renderMixes(){
  const cur=S.mix;
  const all=[...PRESETS.map(p=>({...p,preset:true})), ...S.saved.map((p,i)=>({...p,idx:i}))];
  $('mixes').innerHTML = all.map((p,i)=>`<button class="chip ${mixEq(cur,p.mix)&&playing?'on':''}" data-i="${i}">${esc(pname(p.name))}${p.preset?'':`<span class="x" data-del="${p.idx}" aria-label="${esc(t('del',p.name))}">✕</span>`}</button>`).join('')
    + `<button class="chip add" id="addMix">${t('addMix')}</button>`;
  $('mixes').onclick = e=>{
    const del=e.target.closest('[data-del]');
    if (del){ e.stopPropagation(); const n=S.saved[+del.dataset.del].name; S.saved.splice(+del.dataset.del,1); save(); renderMixes(); toast(t('deleted',n)); return; }
    if (e.target.closest('#addMix')){ if (!Object.keys(S.mix).length){ toast(t('firstSound')); return; } $('saveBox').hidden=false; $('mixName').focus(); return; }
    const c=e.target.closest('.chip'); if (!c) return;
    const p=all[+c.dataset.i]; S.mix={...p.mix}; S.mixName=p.name; save();
    for (const id in S.mix){ const r=$('v-'+id); r.value=Math.round(S.mix[id]*100); }
    if (ctx) for (const id in live) if (id in S.mix) live[id].out.gain.setTargetAtTime(level(id),ctx.currentTime,.2);
    play();
  };
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
  document.querySelectorAll('.tile').forEach(t=>{
    const id=t.dataset.id, on=id in S.mix; t.classList.toggle('on',on);
    t.querySelector('.tbtn').setAttribute('aria-pressed',on);
    const r=t.querySelector('input'); if (on && Math.abs(r.value/100-S.mix[id])>.01) r.value=Math.round(S.mix[id]*100);
    r.style.setProperty('--p', r.value+'%');
  });
  const ids=Object.keys(S.mix);
  $('playBtn').innerHTML = playing?PAUSE:PLAY; $('playBtn').setAttribute('aria-label', playing?t('pause'):t('play'));
  $('nowT').textContent = ids.length ? (pname(S.mixName) || ids.map(i=>nm(BY[i])).slice(0,3).join(' + ') + (ids.length>3?t('more',ids.length-3):'')) : t('pick');
  $('nowS').textContent = !ids.length ? t('tapTile') : playing ? t('playing',ids.length) : t('paused');
  $('timerBtn').classList.toggle('on', !!timer);
  $('timerLbl').textContent = timer ? fmt((timer.end-Date.now())/1000) : t('timer');
  renderMixes();
}
function media(){
  if (Native){
    try {
      if (playing) Native.start({title:$('nowT').textContent, text:$('nowS').textContent, stopLabel:LANG==='ar'?'إيقاف':'Stop'});
      else Native.stop();
    } catch(e){}
  }
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({title: $('nowT').textContent, artist:'Hushfall', album:'Sleep sounds'});
    navigator.mediaSession.playbackState = playing?'playing':'paused';
    navigator.mediaSession.setActionHandler('play', play);
    navigator.mediaSession.setActionHandler('pause', pause);
    navigator.mediaSession.setActionHandler('stop', pause);
  } catch(e){}
}
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }

/* timer sheet */
const TOPTS=[15,30,45,60,90,120,240,0];
const FOPTS=[30,120,300];
function openSheet(){
  $('timerOpts').innerHTML = TOPTS.map(m=>`<button class="chip" data-m="${m}">${m?durLabel(m):t('off')}</button>`).join('');
  $('fadeOpts').innerHTML = FOPTS.map(x=>`<button class="chip ${S.fade===x?'on':''}" data-f="${x}">${secLabel(x)}</button>`).join('');
  $('sheetP').textContent = timer ? t('sheetOn', fmt((timer.end-Date.now())/1000)) : t('sheetIdle');
  $('sheet').hidden=$('sheetBg').hidden=false;
}
const closeSheet=()=>{ $('sheet').hidden=$('sheetBg').hidden=true; };
$('timerBtn').onclick=openSheet; $('sheetBg').onclick=closeSheet;
$('timerOpts').onclick=e=>{ const b=e.target.closest('[data-m]'); if (!b) return; setTimer(+b.dataset.m); closeSheet(); };
$('fadeOpts').onclick=e=>{ const b=e.target.closest('[data-f]'); if (!b) return; S.fade=+b.dataset.f; save(); openSheet(); };

$('playBtn').onclick=()=> playing?pause():play();
const mv=$('master'); mv.value=Math.round(S.master*100); mv.style.setProperty('--p',mv.value+'%');
mv.oninput=()=>{ S.master=mv.value/100; mv.style.setProperty('--p',mv.value+'%'); save(); if (master) master.gain.setTargetAtTime(S.master*S.master, ctx.currentTime, .05); };

$('saveBox').onsubmit=e=>{ e.preventDefault(); const n=$('mixName').value.trim(); if (!n){ $('mixName').focus(); return; }
  S.saved.push({name:n, mix:{...S.mix}}); S.mixName=n; save(); $('mixName').value=''; $('saveBox').hidden=true; render(); toast(t('saved',n)); };
$('saveCancel').onclick=()=>{ $('saveBox').hidden=true; };

/* dim screen */
let wake=null;
function clockTick(){
  const d=new Date(); $('clock').textContent=d.toLocaleTimeString(LANG==='ar'?'ar-u-nu-latn':[], {hour:'2-digit',minute:'2-digit'});
  $('dimSub').textContent = timer ? t('stopsIn', fmt((timer.end-Date.now())/1000)) : playing ? t('wake') : t('nothing');
  $('clock').style.transform=`translate(${R(-8,8)}px,${R(-8,8)}px)`;
}
$('dimBtn').onclick=async()=>{ $('dim').hidden=false; clockTick(); try { wake = await navigator.wakeLock?.request('screen'); } catch(e){} };
$('dim').onclick=()=>{ $('dim').hidden=true; try{ wake?.release(); }catch(e){} wake=null; };

setInterval(()=>{ if (timer){ $('timerLbl').textContent=fmt((timer.end-Date.now())/1000); schedule(); } if (!$('dim').hidden) clockTick(); }, 1000);
document.addEventListener('visibilitychange',()=>{ if (!document.hidden && playing && ctx && ctx.state!=='running'){ ctx.resume(); outEl?.play().catch(()=>{}); } });

/* sky */
function sky(){
  const c=$('sky'), dpr=Math.min(2,window.devicePixelRatio||1), w=innerWidth, h=innerHeight;
  c.width=w*dpr; c.height=h*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr);
  const bg=g.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#0b0e1f'); bg.addColorStop(1,'#141733'); g.fillStyle=bg; g.fillRect(0,0,w,h);
  const m=g.createRadialGradient(w*.85,h*.04,0,w*.85,h*.04,Math.max(w,h)*.55); m.addColorStop(0,'rgba(243,212,155,.10)'); m.addColorStop(1,'rgba(243,212,155,0)');
  g.fillStyle=m; g.fillRect(0,0,w,h);
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for (let i=0;i<Math.round(w*h/5000);i++){ const y=rnd()*h; g.globalAlpha=(.15+rnd()*.55)*(1-y/h*.8); g.fillStyle='#e8e5f3'; g.beginPath(); g.arc(rnd()*w,y,rnd()*1.1+.2,0,7); g.fill(); }
  g.globalAlpha=1;
}
addEventListener('resize', sky);

/* offline render, used by automated sound tests */
window.__hushRender = async (id, sec=12, vol=.6) => {
  const real=ctx, sr=44100, off=new OfflineAudioContext(2, sr*sec, sr);
  ctx=off;
  try {
    if (!NB.white){ NB.white=makeNoise('white',7); NB.pink=makeNoise('pink',7); NB.brown=makeNoise('brown',7); }
    const out=gain(BY[id].lvl*vol*vol*2.2); out.connect(off.destination);
    const r=BY[id].build(out); let next=BY[id].first ?? .05;
    if (r.tick) while (next<sec) next+=r.tick(next);
  } finally { ctx=real; }
  return off.startRendering();
};

function applyLang(l){
  LANG=l; S.lang=l; save();
  const root=document.documentElement; root.lang=l; root.dir = l==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  $('foot').innerHTML = NATIVE ? t('foot').replace(/\s*<b>.*$/,'') : t('foot');
  $('langBtn').textContent=t('langBtn'); $('langBtn').setAttribute('aria-label',t('langLabel'));
  $('dimBtn').setAttribute('aria-label',t('dim')); $('master').setAttribute('aria-label',t('mainVol'));
  $('sheet').setAttribute('aria-label',t('sleepTimer')); $('timerBtn').setAttribute('aria-label',t('sleepTimer'));
  buildGrid(); render(); media();
}
$('langBtn').onclick=()=>applyLang(LANG==='ar'?'en':'ar');
if (Native){ try { Native.addListener('stop', ()=>{ if (playing) pause(); }); } catch(e){} }
for (const id in S.mix) if (!BY[id]) delete S.mix[id];
sky();
applyLang(S.lang || ((navigator.language||'').toLowerCase().startsWith('ar') ? 'ar' : 'en'));

/* offline install (works when hosted on your own site; skipped inside previews) */
if ('serviceWorker' in navigator && location.protocol==='https:' && !NATIVE) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
</body></html>
