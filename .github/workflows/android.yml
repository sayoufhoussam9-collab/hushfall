name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy the web app into the Android project
        run: npm run sync

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Hushfall.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hushfall-apk
          path: Hushfall.apk

      - name: Publish the APK as the latest download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Hushfall for Android (latest)
          prerelease: false
          make_latest: true
          body: |
            Download **Hushfall.apk** below on your Android phone and open it to install.
            If Android asks, allow installing apps from your browser or files app.
            Build ${{ github.run_number }} from commit ${{ github.sha }}.
          files: Hushfall.apk
